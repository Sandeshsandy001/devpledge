<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#09090b"/>

  <!-- Outer Shield Contour -->
  <path d="M 256 68 L 388 126 L 388 286 C 388 368 256 444 256 444 C 256 444 124 368 124 286 L 124 126 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="16" 
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Inner Geometric Terminal Prompt (> _) -->
  <!-- The '>' Chevron -->
  <path d="M 176 216 L 232 264 L 176 312" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- The '_' Underscore (Glowing Emerald) -->
  <line x1="228" y1="312" x2="292" y2="312" 
        stroke="url(#emeraldGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        filter="url(#emeraldGlow)"/>

  <!-- Commitment Lock in top-right quadrant -->
  <g transform="translate(300, 160)" filter="url(#emeraldGlow)">
    <!-- Lock Shackle -->
    <path d="M 14 18 L 14 10 C 14 -2 38 -2 38 10 L 38 18" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="7" 
          stroke-linecap="round"/>
    <!-- Lock Body -->
    <rect x="0" y="18" width="52" height="42" rx="8" 
          fill="rgba(16, 185, 129, 0.15)" 
          stroke="url(#emeraldGrad)" 
          stroke-width="7"/>
    <!-- Keyhole -->
    <circle cx="26" cy="34" r="4" fill="url(#emeraldGrad)"/>
    <line x1="26" y1="36" x2="26" y2="44" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
